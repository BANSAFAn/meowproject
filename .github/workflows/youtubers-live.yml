name: Sync YouTubers Live Status & Subscribers

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youtubers-live
  cancel-in-progress: true

jobs:
  sync-youtubers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch YouTubers subscribers, LIVE status, and latest videos
        run: node uhahahahahaah/sync-youtubers.mjs
      - name: Fetch latest GitHub Releases for launchers and projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node uhahahahahaah/sync-releases.mjs
      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain public/data/youtubers.json public/data/releases.json Meow/projects/)" ]; then
            git config user.name "meowblin[bot]"
            git config user.email "bot@meowlab.pp.ua"
            git add public/data/youtubers.json public/data/releases.json Meow/projects/
            git commit -m "chore(sync): update live YouTubers status and GitHub releases"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
