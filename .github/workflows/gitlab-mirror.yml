name: Mirror GitHub main and Issues to GitLab

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  mirror-to-gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitLab
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN secret is not set. Skipping GitLab mirror."
            exit 0
          fi
          git push --force "https://oauth2:${GITLAB_TOKEN}@gitlab.com/banernotfake/meowproject.git" HEAD:main

      - name: Sync GitHub Issues to GitLab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN secret is not set. Skipping GitLab issues sync."
            exit 0
          fi
          node - <<'EOF'
          (async () => {
            const glProject = encodeURIComponent('banernotfake/meowproject');
            const ghRepo = process.env.GITHUB_REPOSITORY;
            const ghHeaders = {
              Accept: 'application/vnd.github.v3+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'User-Agent': 'MeowLab-GitLab-Sync'
            };
            const glHeaders = {
              'PRIVATE-TOKEN': process.env.GITLAB_TOKEN,
              'Content-Type': 'application/json'
            };

            async function fetchAllGhIssues() {
              const out = [];
              for (let page = 1; page <= 5; page++) {
                const res = await fetch(`https://api.github.com/repos/${ghRepo}/issues?state=all&per_page=100&page=${page}`, { headers: ghHeaders });
                if (!res.ok) throw new Error(`GitHub API ${res.status}: ${await res.text()}`);
                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) break;
                out.push(...data.filter((i) => !i.pull_request));
                if (data.length < 100) break;
              }
              return out;
            }

            async function fetchAllGlIssues() {
              const out = [];
              for (let page = 1; page <= 5; page++) {
                const res = await fetch(`https://gitlab.com/api/v4/projects/${glProject}/issues?state=all&per_page=100&page=${page}`, { headers: glHeaders });
                if (res.status === 401 || res.status === 403) {
                  console.error('ERROR: GITLAB_TOKEN lacks "api" scope to read/write GitLab issues. Update GITLAB_TOKEN in GitLab with "api" scope.');
                  return null;
                }
                if (!res.ok) throw new Error(`GitLab API ${res.status}: ${await res.text()}`);
                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) break;
                out.push(...data);
                if (data.length < 100) break;
              }
              return out;
            }

            const ghIssues = await fetchAllGhIssues();
            const glIssues = await fetchAllGlIssues();
            console.log(`Fetched ${ghIssues.length} GitHub issues.`);
            if (!glIssues) process.exit(0);
            console.log(`Fetched ${glIssues.length} GitLab issues.`);

            const glByGhNum = new Map();
            const glByTitle = new Map();
            for (const gi of glIssues) {
              const m = (gi.description || '').match(/Synced from GitHub Issue #(\d+)/);
              if (m) glByGhNum.set(Number(m[1]), gi);
              glByTitle.set((gi.title || '').trim().toLowerCase(), gi);
            }

            let created = 0;
            let updated = 0;
            let closed = 0;
            let reopened = 0;

            for (const gh of ghIssues.reverse()) {
              const existing = glByGhNum.get(gh.number) || glByTitle.get((gh.title || '').trim().toLowerCase());
              const labels = (gh.labels || []).map((l) => l.name).filter(Boolean).join(',');
              const desc = `${gh.body || ''}\n\n---\n*Synced from GitHub Issue #${gh.number}: ${gh.html_url}*`;

              if (!existing) {
                const res = await fetch(`https://gitlab.com/api/v4/projects/${glProject}/issues`, {
                  method: 'POST',
                  headers: glHeaders,
                  body: JSON.stringify({ title: gh.title, description: desc, labels })
                });
                if (res.status === 401 || res.status === 403) {
                  console.error('ERROR: GITLAB_TOKEN needs "api" scope to create GitLab issues.');
                  process.exit(0);
                }
                if (!res.ok) {
                  console.error(`Failed to create GitLab issue for GH #${gh.number}: ${res.status} ${await res.text()}`);
                  continue;
                }
                const createdIssue = await res.json();
                created++;
                if (gh.state === 'closed' && createdIssue?.iid) {
                  const cRes = await fetch(`https://gitlab.com/api/v4/projects/${glProject}/issues/${createdIssue.iid}`, {
                    method: 'PUT',
                    headers: glHeaders,
                    body: JSON.stringify({ state_event: 'close' })
                  });
                  if (cRes.ok) closed++;
                }
              } else {
                const needsClose = gh.state === 'closed' && existing.state === 'opened';
                const needsReopen = gh.state === 'open' && existing.state === 'closed';
                const needsContentUpdate = existing.title !== gh.title || (existing.description || '').trim() !== desc.trim();
                if (needsClose || needsReopen || needsContentUpdate) {
                  const payload = { title: gh.title, description: desc, labels };
                  if (needsClose) payload.state_event = 'close';
                  if (needsReopen) payload.state_event = 'reopen';
                  const res = await fetch(`https://gitlab.com/api/v4/projects/${glProject}/issues/${existing.iid}`, {
                    method: 'PUT',
                    headers: glHeaders,
                    body: JSON.stringify(payload)
                  });
                  if (res.ok) {
                    if (needsClose) closed++;
                    else if (needsReopen) reopened++;
                    else updated++;
                  } else {
                    console.error(`Failed to update GitLab issue #${existing.iid}: ${res.status} ${await res.text()}`);
                  }
                }
              }
            }
            console.log(`GitLab Issues sync complete: ${created} created, ${updated} updated, ${closed} closed, ${reopened} reopened.`);
          })().catch((err) => {
            console.error('GitLab Issues sync failed:', err);
            process.exit(1);
          });
          EOF
